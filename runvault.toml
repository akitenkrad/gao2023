# --- reproduce の定性的アンカー ------------------------------------------

[metrics."attitude_rise"]
meaning   = "終端の positive 態度割合から初期割合を引いた上昇幅"
unit      = "ratio"
direction = "up"
range     = [-1.0, 1.0]
scope     = ["run"]

[metrics."cascade_growth_ratio"]
meaning   = "終端の情報カスケード規模を初期規模で割った成長倍率"
unit      = "ratio"
direction = "up"
scope     = ["run"]

[metrics."behavior_adoption_final"]
meaning   = "終端で post または repost を選んだエージェントの割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."emotion_msed"]
meaning   = "終端感情分布と論文参照分布の平均二乗誤差"
unit      = "squared_ratio"
direction = "down"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."attitude_corr"]
meaning   = "positive 態度割合の時系列と単調増加参照列の Pearson 相関"
unit      = "correlation"
direction = "up"
range     = [-1.0, 1.0]
scope     = ["run"]

[metrics."checks_passed"]
meaning   = "定性的アンカーの許容帯に収まった観測量の数"
unit      = "count"
direction = "up"
scope     = ["run"]

[metrics."checks_total"]
meaning   = "照合した定性的アンカーの総数"
unit      = "count"
direction = "none"
scope     = ["run"]
