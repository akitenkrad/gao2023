# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs`，`simulation/src/baseline.rs`，および
# `simulation/src/reproduce.rs` が書いているものと一致していなければならない．
# `reproduce` の baseline 名は 4 模型の列挙から取りうる全組合せを展開している．
#
# 態度・感情・行動・到達規模は伝播過程の記述量なので `direction = "none"` とする．
# 定性的アンカーの観測量だけは，照合で良いと定めた向きを書く．

# --- S³ のラウンド指標 ----------------------------------------------------

[metrics."attitude_positive_frac"]
meaning   = "positive 態度を持つエージェントの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."emotion_calm"]
meaning   = "calm 感情状態にあるエージェントの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."emotion_moderate"]
meaning   = "moderate 感情状態にあるエージェントの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."emotion_intense"]
meaning   = "intense 感情状態にあるエージェントの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."behavior_adoption_rate"]
meaning   = "post または repost を選んだエージェントの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."info_cascade_size"]
meaning   = "seed 投稿から累積して情報が到達したエージェントの数"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- S³ の run 全体と LLM の呼び出し -------------------------------------

[metrics."converged"]
meaning   = "集団状態が収束しきい値内に入って停止したなら 1，打ち切りなら 0"
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_round"]
meaning   = "停止したときの最終ラウンド番号"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_calls"]
meaning   = "この run が行った LLM の呼び出し回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hits"]
meaning   = "LLM 呼び出しのうちキャッシュで応答した回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hit_rate"]
meaning   = "LLM 呼び出しのうちキャッシュで応答した割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

# --- baseline 単独実行 -----------------------------------------------------

[metrics."active_frac"]
meaning   = "古典ベースラインで active または positive 状態にあるノードの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_opinion"]
meaning   = "古典ベースラインにおけるノード意見値の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."cumulative_reached"]
meaning   = "古典ベースラインで累積して到達したノードの数"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- reproduce に同居する古典ベースライン --------------------------------
