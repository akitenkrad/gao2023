[project]
name = "s3-tools"
version = "0.1.0"
description = "Gao et al. (2023) S3 LLM social-network simulation — visualization & analysis tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "networkx>=3.2",
    "socsim-tools",
    # run ディレクトリの読み方は runvault が持つ (read 側は pandas を使うので extra)．
    "runvault[read]",
]

[project.scripts]
s3-tools = "s3_tools.cli:main"

[tool.uv.sources]
socsim-tools = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", subdirectory = "tools/socsim_tools" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_tools"]
