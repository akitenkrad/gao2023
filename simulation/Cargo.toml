[package]
name = "s3-simulation"
version = "0.1.0"
edition = "2021"

[lib]
name = "s3_simulation"
path = "src/lib.rs"

[[bin]]
name = "s3"
path = "src/main.rs"

[dependencies]
rand        = { version = "0.8", features = ["small_rng"] }
csv         = "1.3"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
clap        = { version = "4.5", features = ["derive"] }

# social-simulation framework (socsim) — ABM のエンジン基盤．S³ は LLM 駆動
# エージェントが **有向** ソーシャルネットワーク (フォロー関係) 上で感情・態度・
# 行動を伝播させるモデルなので core + engine + net (DiSocialNetwork; issue #18) に
# 加え，LLM ヘルパ層 socsim-llm を取り込む．socsim-llm の "live" feature が
# ollama + openai 両バックエンド (FallbackClient) を有効化する (issue #21)．
# `reqwest` は使わない (設計 §4.2/§7 の reqwest は socsim-llm で置換)．
# 具体的 commit は Cargo.lock で固定．
socsim-core   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-core" }
socsim-engine = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-engine" }
socsim-net    = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-net" }
socsim-llm    = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-llm", features = ["live"] }

# runvault — 実験記録基盤．run ディレクトリ・config.json・metrics.csv・events.jsonl・
# manifest を持つ．git 依存．具体的な commit は Cargo.lock で固定される．
runvault = { git = "https://github.com/akitenkrad/rs-runvault", branch = "main" }
